<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b112c"/>
      <stop offset="50%" stop-color="#0d1435"/>
      <stop offset="100%" stop-color="#070b1a"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Background Circle Arc -->
  <circle cx="256" cy="205" r="140" fill="none" stroke="url(#circleGrad)" stroke-width="5" opacity="0.6"/>

  <!-- Upward Trend Arrow -->
  <path d="M 170,205 Q 240,170 280,140" fill="none" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="280,125 295,145 270,145" fill="#38bdf8" transform="rotate(35 285 140)"/>

  <!-- Bar Chart Columns (3D style) -->
  <rect x="160" y="230" width="32" height="55" rx="8" fill="url(#bar1)"/>
  <rect x="198" y="210" width="32" height="75" rx="8" fill="url(#bar2)"/>
  <rect x="236" y="190" width="32" height="95" rx="8" fill="url(#bar3)"/>
  <rect x="274" y="160" width="32" height="125" rx="8" fill="url(#bar4)"/>

  <!-- Calculator (Isometric/Frontal) -->
  <rect x="295" y="195" width="80" height="105" rx="14" fill="url(#calcGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- Screen -->
  <rect x="306" y="206" width="58" height="24" rx="6" fill="#1e1b4b" opacity="0.9"/>
  <!-- Keypad Buttons -->
  <rect x="306" y="238" width="24" height="20" rx="4" fill="#6366f1"/>
  <text x="318" y="253" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">+</text>
  
  <rect x="340" y="238" width="24" height="20" rx="4" fill="#6366f1"/>
  <text x="352" y="252" font-family="sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">-</text>

  <rect x="306" y="266" width="24" height="20" rx="4" fill="#6366f1"/>
  <text x="318" y="280" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">×</text>

  <rect x="340" y="266" width="24" height="20" rx="4" fill="#6366f1"/>
  <text x="352" y="280" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">=</text>

  <!-- Open Book Base -->
  <g transform="translate(0, 10)">
    <!-- Book Spine & Cover shadow -->
    <path d="M 115,340 Q 256,380 397,340 L 415,355 Q 256,395 97,355 Z" fill="url(#bookCover)"/>
    <!-- Left Page -->
    <path d="M 110,335 Q 185,320 256,345 L 256,305 Q 185,275 110,295 Z" fill="url(#bookPages)"/>
    <!-- Right Page -->
    <path d="M 402,335 Q 327,320 256,345 L 256,305 Q 327,275 402,295 Z" fill="url(#bookPages)"/>
    <!-- Middle seam -->
    <path d="M 256,305 L 256,350" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Text: ContaEstudo -->
  <g transform="translate(256, 415)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      Conta<tspan fill="#a78bfa">Estudo</tspan>
    </text>
    <text y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" fill="#94a3b8" letter-spacing="3.5">
      CONTABILIDADE • APRENDA • EVOLUA
    </text>
  </g>
</svg>
