<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#1E3A8A"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="ContaGlobal"/>
    <meta name="apple-touch-fullscreen" content="yes"/>
    <link rel="apple-touch-icon" href="/logo_icone_192.png"/>
    <title>Remix Contabilidade Unificada</title>
    <meta name="description" content="App de estudos de contabilidade com IA especializada. Tire dúvidas, envie documentos e receba explicações detalhadas na hora." />
    <meta property="og:title" content="Remix Contabilidade Unificada" />
    <meta property="og:description" content="App de estudos de contabilidade com IA especializada. Tire dúvidas, envie documentos e receba explicações detalhadas na hora." />

    <!-- DNS Prefetch & Preconnect for High-Priority External Services -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebaseapp.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />

    <!-- Critical Zero-FOUC Fast Inline Style -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #0A1628;
        color: #E8EDF5;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <script>
      // iOS Safari Private Browsing Global localStorage Protection Guard
      (function() {
        try {
          var test = '__cg_test__';
          window.localStorage.setItem(test, '1');
          window.localStorage.removeItem(test);
        } catch(e) {
          try {
            var mem = {};
            var safeMock = {
              length: 0,
              clear: function() { mem = {}; },
              getItem: function(k) { return mem.hasOwnProperty(k) ? mem[k] : null; },
              key: function(i) { return Object.keys(mem)[i] || null; },
              removeItem: function(k) { delete mem[k]; },
              setItem: function(k, v) { mem[k] = String(v); }
            };
            Object.defineProperty(window, 'localStorage', { value: safeMock, configurable: true, writable: true });
          } catch(err) {}
        }
      })();

      // Immediate theme & appearance initialization from localStorage to prevent flash of white (zero FOUC)
      (function() {
        try {
          var appearanceRaw = null;
          try {
            appearanceRaw = localStorage.getItem('ga:global:appearance') || localStorage.getItem('ga_appearance_preferences');
            if (!appearanceRaw) {
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.startsWith('ga:') && k.endsWith(':appearance')) {
                  appearanceRaw = localStorage.getItem(k);
                  break;
                }
              }
            }
          } catch (e) {}

          var baseTheme = 'navy-dark';
          var accentHex = '#4A90E2';
          var glassIntensity = 65;
          var halosEnabled = true;

          if (appearanceRaw) {
            try {
              var parsed = JSON.parse(appearanceRaw);
              if (parsed.baseTheme) baseTheme = parsed.baseTheme;
              if (parsed.accentHex) accentHex = parsed.accentHex;
              if (typeof parsed.glassIntensity === 'number') glassIntensity = parsed.glassIntensity;
              if (parsed.halosEnabled !== undefined) halosEnabled = parsed.halosEnabled;
            } catch(e) {}
          } else {
            try {
              var oldTheme = localStorage.getItem('app_theme');
              if (oldTheme === 'light') baseTheme = 'light-pro';
            } catch(e) {}
          }

          var root = document.documentElement;
          if (baseTheme === 'light-pro') {
            root.classList.remove('dark');
            root.style.setProperty('--app-bg-gradient', '#F0F4FA');
          } else {
            root.classList.add('dark');
            root.style.setProperty('--app-bg-gradient', 'linear-gradient(135deg, #0A1628 0%, #0F1929 40%, #1A1040 70%, #0A1628 100%)');
          }

          root.style.setProperty('--color-accent', accentHex);
          var ratio = Math.max(0, Math.min(100, glassIntensity)) / 100;
          root.style.setProperty('--glass-blur', Math.round(ratio * 30) + 'px');
          root.style.setProperty('--glass-card-bg', 'rgba(255, 255, 255, ' + (0.02 + ratio * 0.07).toFixed(3) + ')');
          root.style.setProperty('--glass-card-border', 'rgba(255, 255, 255, ' + (0.05 + ratio * 0.10).toFixed(3) + ')');
          root.style.setProperty('--halo-display', halosEnabled ? 'block' : 'none');
        } catch (e) {}
      })();
    </script>
    <script>
      // Registo e ativação do Service Worker ContaGlobal (com suporte diferenciado para iOS Safari)
      (function() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            var swScript = isIOS ? '/sw-ios.js' : '/sw.js';

            navigator.serviceWorker.register(swScript)
              .then(function(registration) {
                console.log('[SW Registration] Service Worker registado (' + swScript + '):', registration.scope);
                
                if (registration.active) {
                  registration.active.postMessage({ type: 'WARM_OFFLINE_PAGES' });
                }

                registration.addEventListener('updatefound', function() {
                  var installingWorker = registration.installing;
                  if (installingWorker) {
                    installingWorker.addEventListener('statechange', function() {
                      if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        console.log('[SW Update] Nova versão disponível. A atualizar caches...');
                        window.dispatchEvent(new CustomEvent('sw_update_ready'));
                      }
                    });
                  }
                });
              })
              .catch(function(err) {
                console.debug('[SW Registration] Info no registo do Service Worker:', err);
              });

            navigator.serviceWorker.addEventListener('controllerchange', function() {
              if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'WARM_OFFLINE_PAGES' });
              }
            });
          });
        }
      })();
    </script>
    <script>
      // Suppress benign Vite WebSocket HMR disconnection errors in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('closed without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        if (msg.includes('WebSocket') || msg.includes('vite')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <!-- Fallback visível de arranque imediato para evitar ecrã negro antes da montagem do React -->
    <div id="app-fallback" style="
      position: fixed; inset: 0;
      background: #0A1628;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #E8EDF5; gap: 16px;
      z-index: 999999;
    ">
      <div style="font-size: 48px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));">🇦🇴</div>
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #FFFFFF;">ContaGlobal</div>
      <div style="font-size: 13px; font-weight: 500; color: #94A3B8; margin-top: -8px;">Sistema de Gestão & Contabilidade PGC Angola</div>
      <div style="
        width: 36px; height: 36px;
        border: 3px solid rgba(74,144,226,0.25);
        border-top-color: #4A90E2;
        border-radius: 50%;
        margin-top: 8px;
        animation: cgFallbackSpin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      "></div>
      <style>
        @keyframes cgFallbackSpin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <div id="root"></div>

    <script>
      // Esconder fallback quando o React montar com sucesso
      window.__hideAppFallback = function() {
        var fb = document.getElementById('app-fallback');
        if (fb) {
          fb.style.opacity = '0';
          fb.style.transition = 'opacity 0.25s ease-out';
          setTimeout(function() {
            if (fb && fb.parentNode) fb.parentNode.removeChild(fb);
          }, 300);
        }
      };

      // Fallback de emergência se o bundle demorar mais de 6 segundos
      setTimeout(function() {
        var fb = document.getElementById('app-fallback');
        if (fb && fb.style.display !== 'none' && !document.getElementById('root')?.hasChildNodes()) {
          var btn = document.createElement('div');
          btn.style.marginTop = '20px';
          btn.style.display = 'flex';
          btn.style.gap = '10px';
          btn.innerHTML = '<button onclick="localStorage.clear(); window.location.reload();" style="padding: 10px 18px; background: #2563EB; color: white; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.3);">Limpar Cache & Recarregar</button>' +
                          '<button onclick="window.location.reload();" style="padding: 10px 18px; background: rgba(255,255,255,0.1); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">Recarregar App</button>';
          fb.appendChild(btn);
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
